name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dlt,singer-repro,test]"
      - run: python -m unittest discover -s tests -v
      - run: cursorcheck demo
  singer-history:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['0.45.0', '0.46.0']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install . "singer-sdk==${{ matrix.sdk }}"
      - run: python -m unittest discover -s tests -p test_singer_reproduction.py -v
